<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Task Manager</h1>

    <section class="panel" id="local-section">
      <h2>My Tasks</h2>
      <form id="task-form" class="row">
        <input type="text" id="task-input" placeholder="What needs to be done?" autocomplete="off">
        <input type="number" id="task-minutes" class="minutes" min="1" placeholder="Minutes (optional)">
        <button type="submit" class="btn primary">Add task</button>
      </form>
      <p id="form-error" class="error" hidden></p>

      <div class="stats">
        <span>Total: <strong id="stat-total">0</strong></span>
        <span>Completed: <strong id="stat-completed">0</strong></span>
        <span>Pending: <strong id="stat-pending">0</strong></span>
      </div>

      <ul id="task-list" class="list"></ul>
    </section>

    <section class="panel" id="api-section">
      <h2>API Todos</h2>
      <div class="row wrap">
        <input type="search" id="search-input" placeholder="Search by title">
        <button class="btn filter active" data-filter="all">All</button>
        <button class="btn filter" data-filter="completed">Completed</button>
        <button class="btn filter" data-filter="pending">Pending</button>
        <button class="btn" id="refresh-btn">Refresh</button>
      </div>

      <p id="api-status" class="status" hidden></p>
      <ul id="api-list" class="list"></ul>
    </section>
  </main>

  <script src="async-practice.js"></script>
  <script src="script.js"></script>
</body>
</html>
